#[derive(Serialize)]
pub struct BorderGraph {
  pub version: String, // "1.2"
  pub constraints: Vec<ConstraintNode>,
  pub budget_envelope: BudgetGate,
  pub audit_hash: String,
}

pub fn parse_to_border(ifc_path: &str) -> Result<BorderGraph> {
  let model = IfcModel::from_file(ifc_path)?;
  let nodes = extract_constraints(&model, 0.0003)?;
  let mut hasher = Hasher::new();
  hasher.update(&serde_json::to_vec(&nodes)?);
  Ok(BorderGraph {
    version: "1.2".into(),
    constraints: nodes,
    budget_envelope: BudgetGate::load()?,
    audit_hash: hasher.finalize().to_hex().to_string(),
  })

- Reality Mainframe: Temporal.io state machine, NATS backbone, OS bundle

docker-compose up --build

Version 1.2 — Founder-Driven

## Roles
- Founder: Owns Brief → Border approval, Channel surf final, OS Install sign-off
- Annotator: Tomas rubric 7-point, cultural pack, edge-case 100, consensus
- Builder: Runs engines, monitors NATS/Temporal, bundle verification
- Client: Reviews Vision Wall, chooses channels, approves compliance

## Day 1-10 Workflow
### Day 1 — Quiet Visualization
- [ ] Ingest Brief.pdf, Site.dwg, Budget.csv
- [ ] Run architecture-engine: cargo run -- --ifc site.ifc --out BorderGraph.json
- [ ] Verify audit_hash blake3, OPA policy pass
- [ ] Publish border.validated to NATS

### Day 2-3 — Generate 100
- [ ] Seed 100 LHS variations: python kinetic-engine/simulation.py --border BorderGraph.json --n 100
- [ ] Simulate 8760h compressed, GPU accelerated
- [ ] Score light/flow/energy/acoustic
- [ ] Emit MotionSet[100] → motion.generated

### Day 4 — Channel Surf
- [ ] GuerillaNet collection if predicate exists
- [ ] Flywheel ingest: python flywheel-engine/flywheel.py --ingest motions.parquet
- [ ] Index Qdrant CLIP embeddings
- [ ] Vision Wall React Three.js surf, Founder chooses

### Day 5-10 — Build
- [ ] Compliance DNA 7-point rubric per channel
- [ ] If <0.9 → human queue, 2 annotators, κ>0.8
- [ ] Edge-case 100 fuzz
- [ ] WORM audit log

### Day 11 — OS Install
- [ ] Mainframe bundles IFC+Docs+OS wasm
- [ ] Verify blake3 manifest
- [ ] Deploy to S3+IPFS dual
- [ ] Client sign-off

## Commands
\`\`\`bash
# Architecture
cargo build -p architecture-engine && ./target/release/architecture-engine --ifc input.ifc

# Kinetic
pip install -r kinetic-engine/requirements.txt
python kinetic-engine/simulation.py --border BorderGraph.json

# GuerillaNet
cargo run -p guerillanet-p2p -- --predicate predicate.json --bootstrap dht.bootstrap

# Flywheel
python flywheel-engine/flywheel.py --recall "farmers branch courtyard" --top_k 10

# Compliance
python compliance-engine/compliance.py --channel channel_hash --cultural farmers_branch

# Mainframe
python mainframe-core/workflow.py --project project_id

# Full stack
docker-compose up --build
\`\`\`

Version 1.2 — Founder-Driven

## Roles
- Founder: Owns Brief → Border approval, Channel surf final, OS Install sign-off
- Annotator: Tomas rubric 7-point, cultural pack, edge-case 100, consensus
- Builder: Runs engines, monitors NATS/Temporal, bundle verification
- Client: Reviews Vision Wall, chooses channels, approves compliance

## Day 1-10 Workflow
### Day 1 — Quiet Visualization
- [ ] Ingest Brief.pdf, Site.dwg, Budget.csv
- [ ] Run architecture-engine: cargo run -- --ifc site.ifc --out BorderGraph.json
- [ ] Verify audit_hash blake3, OPA policy pass
- [ ] Publish border.validated to NATS

### Day 2-3 — Generate 100
- [ ] Seed 100 LHS variations: python kinetic-engine/simulation.py --border BorderGraph.json --n 100
- [ ] Simulate 8760h compressed, GPU accelerated
- [ ] Score light/flow/energy/acoustic
- [ ] Emit MotionSet[100] → motion.generated

### Day 4 — Channel Surf
- [ ] GuerillaNet collection if predicate exists
- [ ] Flywheel ingest: python flywheel-engine/flywheel.py --ingest motions.parquet
- [ ] Index Qdrant CLIP embeddings
- [ ] Vision Wall React Three.js surf, Founder chooses

### Day 5-10 — Build
- [ ] Compliance DNA 7-point rubric per channel
- [ ] If <0.9 → human queue, 2 annotators, κ>0.8
- [ ] Edge-case 100 fuzz
- [ ] WORM audit log

### Day 11 — OS Install
- [ ] Mainframe bundles IFC+Docs+OS wasm
- [ ] Verify blake3 manifest
- [ ] Deploy to S3+IPFS dual
- [ ] Client sign-off

## Commands
\`\`\`bash
# Architecture
cargo build -p architecture-engine && ./target/release/architecture-engine --ifc input.ifc

# Kinetic
pip install -r kinetic-engine/requirements.txt
python kinetic-engine/simulation.py --border BorderGraph.json

# GuerillaNet
cargo run -p guerillanet-p2p -- --predicate predicate.json --bootstrap dht.bootstrap

# Flywheel
python flywheel-engine/flywheel.py --recall "farmers branch courtyard" --top_k 10

# Compliance
python compliance-engine/compliance.py --channel channel_hash --cultural farmers_branch

# Mainframe
python mainframe-core/workflow.py --project project_id

# Full stack
docker-compose up --build
\`\`\`
