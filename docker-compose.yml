version: "3.9"
services:
  dna-framework:
    build:./dna-framework
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 5s, retries: 3 }
    ports: ["8080:8080"]
  architecture-engine:
    build:./architecture-engine
    depends_on: { dna-framework: { condition: service_healthy } }
    environment: [DNA_URL=http://dna-framework:8080]
  kinetic-engine:
    build:./kinetic-engine
    depends_on: [dna-framework, architecture-engine, guerillanet-p2p, flywheel-engine]
  guerillanet-p2p:
    build:./guerillanet-p2p
    depends_on: { dna-framework: { condition: service_healthy } }
  flywheel-engine:
    build:./flywheel-engine
    depends_on: [dna-framework]
  mainframe-core:
    build:./mainframe-core
    depends_on: { dna-framework: { condition: service_healthy }, architecture-engine: { condition: service_started }, kinetic-engine: { condition: service_started } }
  nats: { image: nats:2.10-jetstream, ports: ["4222:4222"] }
  qdrant: { image: qdrant/qdrant, ports: ["6333:6333"] }
