services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/"]
      interval: 2s
      timeout: 2s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  dna-framework:
    build:
      context: .
      dockerfile: ./dna-framework/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  brain-engine:
    build:
      context: .
      dockerfile: ./brain-engine/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped

  filter-engine:
    build:
      context: .
      dockerfile: ./filter-engine/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
